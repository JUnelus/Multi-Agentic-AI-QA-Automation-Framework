name: Deterministic QA validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:framework
      - run: npm run test:saucedemo
      - run: npm run typecheck:generated
      - run: npm run test:generated:list
      - run: npm run test:generated:fixture
      - run: npm run pipeline:saucedemo:no-ai
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qa-validation
          path: |
            playwright-report/
            test-results/
            generated/runs/
          retention-days: 14
